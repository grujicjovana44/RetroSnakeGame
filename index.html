<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RetroSnake: Prepreke</title>
    <style>
      body {
        background: #0d0f12;
        color: #e6e6e6;
        font-family: 'Courier New', monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding-top: 32px;
      }
      canvas {
        background: #111417;
        border: 2px solid #3a3f47;
        image-rendering: pixelated;
      }
      #hud {
        display: flex;
        gap: 24px;
        font-size: 18px;
      }
      #difficulty-controls {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
      #difficulty-controls span {
        color: #b8c2cc;
        font-size: 14px;
        margin-right: 4px;
      }
      button {
        background: #29323b;
        border: 2px solid #4e9d67;
        color: #e6e6e6;
        cursor: pointer;
        font: bold 16px 'Courier New', monospace;
        padding: 8px 14px;
      }
      button:hover {
        border-color: #f3c969;
      }
      button[aria-pressed="true"] {
        background: #8fd694;
        color: #111417;
      }
      #restart {
        background: #8fd694;
        color: #111417;
      }
      #ai-advice {
        border-color: #f3c969;
      }
      #ai-advice-panel {
        border: 1px solid #3a3f47;
        max-width: 560px;
        padding: 12px 16px;
        width: calc(100% - 32px);
      }
      #ai-advice-panel[hidden] {
        display: none;
      }
      #ai-advice-panel h2 {
        color: #f3c969;
        font-size: 18px;
        margin: 0 0 8px;
      }
      #ai-advice-panel p {
        margin: 6px 0;
      }
      #practice-plan-controls {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
      #practice-plan-controls[hidden],
      #practice-plan-panel[hidden],
      #practice-plan-metrics[hidden] {
        display: none;
      }
      #practice-goal {
        background: #111417;
        border: 2px solid #4e9d67;
        color: #e6e6e6;
        font: 16px 'Courier New', monospace;
        padding: 8px;
      }
      #practice-plan-button {
        border-color: #8fd694;
      }
      #practice-plan-panel {
        border: 1px solid #3a3f47;
        max-width: 560px;
        padding: 12px 16px;
        width: calc(100% - 32px);
      }
      #practice-plan-panel h2 {
        color: #8fd694;
        font-size: 18px;
        margin: 0 0 8px;
      }
      #practice-plan-panel p {
        margin: 6px 0;
      }
      #practice-plan-metrics {
        display: grid;
        gap: 4px 16px;
        grid-template-columns: max-content minmax(0, 1fr);
        margin: 12px 0 0;
      }
      #practice-plan-metrics dt {
        color: #b8c2cc;
      }
      #practice-plan-metrics dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <h1>RetroSnake: Prepreke</h1>
    <div id="hud">
      <span id="score">Skor: 0</span>
      <span id="status">Status: spremno</span>
    </div>
    <div id="difficulty-controls" aria-label="Izbor brzine za sledeću partiju">
      <span>Brzina za sledeću partiju:</span>
      <button type="button" data-difficulty="easy" aria-pressed="false">Sporo</button>
      <button type="button" data-difficulty="normal" aria-pressed="true">Normalno</button>
      <button type="button" data-difficulty="hard" aria-pressed="false">Brzo</button>
    </div>
    <canvas id="game" width="400" height="400"></canvas>
    <button id="restart" type="button" hidden>Restartuj partiju</button>
    <button id="ai-advice" type="button" hidden>AI Advice</button>
    <div id="practice-plan-controls" hidden>
      <label for="practice-goal">Cilj vežbanja</label>
      <select id="practice-goal">
        <option value="survive_longer">Preživi duže</option>
        <option value="collect_more_food">Sakupi više hrane</option>
      </select>
      <button id="practice-plan-button" type="button">Practice Plan</button>
    </div>
    <section id="practice-plan-panel" aria-live="polite" hidden>
      <h2>Practice Plan</h2>
      <p id="practice-plan-status" role="status"></p>
      <p id="practice-plan-target"></p>
      <p id="practice-plan-summary"></p>
      <p id="practice-plan-recommendation"></p>
      <dl id="practice-plan-metrics" hidden>
        <dt>Rating</dt><dd id="practice-plan-rating"></dd>
        <dt>Score</dt><dd id="practice-plan-score"></dd>
        <dt>Duration</dt><dd id="practice-plan-duration"></dd>
        <dt>Food collected</dt><dd id="practice-plan-food"></dd>
        <dt>Food per minute</dt><dd id="practice-plan-food-rate"></dd>
        <dt>Score per food</dt><dd id="practice-plan-score-rate"></dd>
        <dt>Target ratio</dt><dd id="practice-plan-target-ratio"></dd>
      </dl>
    </section>
    <section id="ai-advice-panel" aria-live="polite" hidden>
      <h2>AI Advice</h2>
      <p id="ai-advice-summary"></p>
      <p id="ai-advice-recommendation"></p>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
